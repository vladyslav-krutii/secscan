apiVersion: apps/v1
kind: Deployment
metadata:
  name: secscan
  labels:
    app: secscan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secscan
  template:
    metadata:
      labels:
        app: secscan
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics/"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Pushed by CI to GHCR (see .github/workflows/ci.yml).
          image: ghcr.io/vladyslav-krutii/secscan:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Behind the Ingress every request arrives from the ingress
            # controller pod, so without this all clients would share one
            # rate-limit bucket. Set it to the address range of the ingress
            # controller pods -- kind's default pod CIDR is used here.
            # Trade-off: any pod in that range can then choose its own
            # X-Forwarded-For; a NetworkPolicy that only admits the ingress
            # controller removes that.
            - name: SECSCAN_TRUSTED_PROXIES
              value: "10.244.0.0/16"
            - name: SECSCAN_RATE_LIMIT
              value: "10/minute"
            - name: SECSCAN_SCAN_DEADLINE_SECONDS
              value: "10"
            - name: SECSCAN_MAX_CONCURRENT_SCANS
              value: "10"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
