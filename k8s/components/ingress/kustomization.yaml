# Optional: expose SecScan through ingress-nginx instead of port-forward.
# Add to an overlay with `components: [../../components/ingress]`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ingress.yaml
  - networkpolicy.yaml
patches:
  # Behind the ingress every request comes from a controller pod. Only those
  # pods may connect (networkpolicy.yaml), so believing X-Forwarded-For from
  # the pod CIDR is safe: no other pod can reach us to forge it.
  - target:
      kind: Deployment
      name: secscan
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "10.244.0.0/16"
