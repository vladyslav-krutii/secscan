# Ingress to the API only from the ingress-nginx controller pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secscan-ingress-from-controller
spec:
  podSelector:
    matchLabels:
      app: secscan
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
