name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing by default, each job asks for what it needs.
permissions: {}

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Kubernetes manifests render (Kustomize)
        # kubectl is preinstalled on the runner; fails on a broken overlay.
        # The overlay must pin the image by digest, never by tag.
        run: |
          kubectl kustomize k8s/policy > /dev/null
          kubectl kustomize k8s/overlays/kind > rendered.yaml
          grep -E 'image: ghcr.io/.+@sha256:[0-9a-f]{64}$' rendered.yaml

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
          persist-credentials: false
      - name: Gitleaks
        # CLI in a digest-pinned container instead of gitleaks-action
        # (no extra action to trust, no license key needed).
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1 \
            semgrep scan --config p/python --config p/dockerfile \
              --config p/github-actions --error --metrics=off

  deps:
    name: Dependencies (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: pip-audit
        # Resolves the full dependency tree (incl. transitive packages such as
        # starlette) and exits 1 if any package has a known vulnerability.
        run: pip-audit --strict --desc -r requirements.txt -r requirements-dev.txt

  build-scan-push:
    name: Build, scan & push image
    needs: [test, secrets, sast, deps]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # upload SARIF to code scanning
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute lowercase image name
        id: name
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pull request: build once and load it into the local Docker daemon.
      - name: Build image (PR, local only)
        if: github.event_name != 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push to main: build ONCE and push only the immutable :<sha> tag.
      # Everything below (Trivy, Cosign) works on this exact digest, so the
      # image that is scanned is the image that is signed. :latest is moved
      # only after the scan gate and the signature check (sbom-sign job).
      - name: Build and push image (main)
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pick the scan target
        env:
          EVENT: ${{ github.event_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # The pushed digest, read from the registry (no local copy).
            echo "SCAN_REF=${IMAGE}@${DIGEST}" >> "$GITHUB_ENV"
            echo "SCAN_SRC=remote" >> "$GITHUB_ENV"
          else
            echo "SCAN_REF=${IMAGE}:${SHA}" >> "$GITHUB_ENV"
            echo "SCAN_SRC=docker" >> "$GITHUB_ENV"
          fi
          mkdir -p "$HOME/.docker" "$HOME/.cache/trivy"

      - name: Trivy scan (HIGH/CRITICAL → SARIF)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/out" \
            "$TRIVY" image --image-src "$SCAN_SRC" \
            --ignorefile /out/.trivyignore \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output /out/trivy.sarif \
            "$SCAN_REF"

      - name: Upload Trivy results to the Security tab
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Trivy gate (fail on CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            "$TRIVY" image --image-src "$SCAN_SRC" \
            --ignorefile /.trivyignore \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "$SCAN_REF"

  sbom-sign:
    name: SBOM, sign & verify image
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push signature/attestation next to the image
      id-token: write # GitHub OIDC token for Cosign keyless signing
    env:
      SYFT: anchore/syft:v1.57.2@sha256:e97e20b6e6d1699c60296b66ab337941724f9bd06ac279d893eda89601fc4b2a
      IMAGE: ${{ needs.build-scan-push.outputs.image }}
      # Always refer to the image by digest: a tag can be moved, a digest cannot.
      # It is the same digest Trivy scanned in the previous job.
      REF: ${{ needs.build-scan-push.outputs.image }}@${{ needs.build-scan-push.outputs.digest }}
      # Who is allowed to have signed it: this workflow on main, via GitHub OIDC.
      IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: SBOM (Syft, SPDX JSON)
        run: |
          docker run --rm \
            -v "$HOME/.docker/config.json:/config/config.json:ro" -e DOCKER_CONFIG=/config \
            -v "$PWD:/out" \
            "$SYFT" "registry:$REF" -o spdx-json=/out/sbom.spdx.json

      - name: Upload SBOM as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json

      - name: Sign image (keyless)
        run: cosign sign --yes "$REF"

      - name: Attest SBOM
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: Verify signature and SBOM attestation
        run: |
          cosign verify \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            "$REF" > /dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            "$REF" > /dev/null
          echo "Verified signature and SBOM attestation for $REF"

      # Only now does :latest point at the new image: scanned, signed and
      # verified. imagetools re-tags in the registry; nothing is rebuilt.
      - name: Move :latest to the verified digest
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "$REF"

      - name: Summary
        run: |
          echo "### Signed image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REF\`" >> "$GITHUB_STEP_SUMMARY"
