services:
  api:
    build: .
    image: secscan:local
    container_name: secscan-api
    ports:
      - "8000:8000"
    # Abuse-protection knobs (see README "Abuse protection"). The values are
    # the application defaults; override from the shell, for example
    #   SECSCAN_SCAN_DEADLINE_SECONDS=3 docker compose up -d api
    environment:
      - SECSCAN_RATE_LIMIT=${SECSCAN_RATE_LIMIT:-10/minute}
      - SECSCAN_SCAN_DEADLINE_SECONDS=${SECSCAN_SCAN_DEADLINE_SECONDS:-10}
      - SECSCAN_MAX_CONCURRENT_SCANS=${SECSCAN_MAX_CONCURRENT_SCANS:-10}
      # No reverse proxy in front of the API here, so trust nobody's
      # X-Forwarded-For.
      - SECSCAN_TRUSTED_PROXIES=${SECSCAN_TRUSTED_PROXIES:-}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: secscan-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    container_name: secscan-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # Host port is configurable in case 3000 is already taken locally:
      #   GRAFANA_PORT=3001 docker compose up -d
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
